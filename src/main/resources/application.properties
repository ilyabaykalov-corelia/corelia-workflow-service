spring.application.name=corelia-workflow-service
corelia.service=corelia-workflow-service
spring.config.import=classpath:corelia-defaults.properties,optional:configtree:/run/secrets/
server.port=${PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=file:${CORELIA_KEY_STORE}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${corelia.tls.password}
server.ssl.trust-store=file:${CORELIA_TRUST_STORE}
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store-password=${corelia.tls.password}
server.ssl.client-auth=need
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
server.http2.enabled=true
spring.datasource.url=${CORELIA_WORKFLOW_DB_URL:jdbc:postgresql://postgres:5432/corelia_workflow}
spring.datasource.username=${CORELIA_WORKFLOW_DB_USERNAME:corelia_workflow}
spring.datasource.password=${corelia.workflow.db.password:}
spring.liquibase.change-log=classpath:db/changelog/workflow-master.yaml
# Создание схемы Flowable выполняется отдельно одним экземпляром до масштабирования.
flowable.database-schema-update=${CORELIA_FLOWABLE_DATABASE_SCHEMA_UPDATE:false}
flowable.async-executor-activate=${CORELIA_FLOWABLE_ASYNC_EXECUTOR_ACTIVATE:true}
management.endpoints.web.exposure.include=health,info,metrics
