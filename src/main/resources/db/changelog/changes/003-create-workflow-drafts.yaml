databaseChangeLog:
  - changeSet:
      id: workflow-003-create-workflow-drafts
      author: corelia
      changes:
        - createTable:
            tableName: workflow_draft
            columns:
              - column:
                  name: workflow_key
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_workflow_draft
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: bpmn_xml
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - createTable:
            tableName: workflow_audit
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_workflow_audit
              - column:
                  name: workflow_key
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: occurred_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
